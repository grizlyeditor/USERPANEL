<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Your Reward</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIocBYNxKbvhEd5dXZy9xtCMVIc7b1PLE",
            authDomain: "visualhosting-88a92.firebaseapp.com",
            projectId: "visualhosting-88a92",
            storageBucket: "visualhosting-88a92.firebasestorage.app",
            messagingSenderId: "364627318409",
            appId: "1:364627318409:web:b047ac4db8cdc3b254d858",
            measurementId: "G-5GV65EXGH4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const userDashboard = document.getElementById('user-dashboard');
        const successPage = document.getElementById('success-page');
        const redeemForm = document.getElementById('redeem-form');
        const newRedeemBtn = document.getElementById('new-redeem-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const rewardDesc = document.getElementById('reward-desc');

        // Handle reward redemption
        async function redeemReward(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const redeemCode = document.getElementById('redeem-code').value;
            
            if (!username || !redeemCode) {
                showError('Please enter both your username and the reward code');
                return;
            }
            
            loadingIndicator.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            
            try {
                // Find reward with the given code
                const q = query(collection(db, "rewards"), where("code", "==", redeemCode));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    showError('Invalid reward code. Please check and try again.');
                    return;
                }
                
                let rewardId = null;
                let rewardData = null;
                
                querySnapshot.forEach((doc) => {
                    rewardId = doc.id;
                    rewardData = doc.data();
                });
                
                if (rewardData.redemptions >= rewardData.maxRedemptions) {
                    showError('This reward has already been fully redeemed.');
                    return;
                }
                
                // Update redemption count
                await updateDoc(doc(db, "rewards", rewardId), {
                    redemptions: increment(1)
                });
                
                // Show success page
                showSuccessPage(rewardData.mainMessage, rewardData.rewardDescription);
            } catch (error) {
                showError('Error redeeming reward: ' + error.message);
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccessPage(message, description) {
            userDashboard.classList.add('hidden');
            successPage.classList.remove('hidden');
            successMessage.textContent = message;
            rewardDesc.textContent = description;
        }

        function resetForm() {
            document.getElementById('username').value = '';
            document.getElementById('redeem-code').value = '';
            errorMessage.classList.add('hidden');
            userDashboard.classList.remove('hidden');
            successPage.classList.add('hidden');
        }

        // Event Listeners
        redeemForm.addEventListener('submit', redeemReward);
        newRedeemBtn.addEventListener('click', resetForm);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            font-family: 'Poppins', sans-serif;
        }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- User Dashboard -->
    <div id="user-dashboard" class="min-h-screen">
        <header class="bg-gradient-to-r from-purple-600 to-indigo-700 text-white shadow-lg">
            <div class="container mx-auto px-4 py-5">
                <h1 class="text-2xl font-bold text-center">
                    <i class="fas fa-gift mr-2"></i> Reward Claim Center
                </h1>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 fade-in">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-gift text-purple-600 text-3xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Redeem Your Reward</h2>
                    <p class="text-gray-600 mt-2">Enter your details to claim your reward</p>
                </div>

                <form id="redeem-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">Telegram Username (without @)</label>
                        <input type="text" id="username" placeholder="MADAARAA" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-2">Reward Code</label>
                        <input type="text" id="redeem-code" placeholder="Enter your code" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>

                    <div id="error-message" class="text-red-500 text-sm hidden"></div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-semibold flex items-center justify-center">
                            <span>Redeem Now</span>
                            <i id="loading-indicator" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Success Page -->
    <div id="success-page" class="min-h-screen hidden">
        <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-50 to-cyan-100 p-4">
            <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden text-center p-8 fade-in">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-trophy text-green-600 text-4xl"></i>
                </div>
                
                <h1 id="success-message" class="text-4xl font-bold text-gray-800 mb-6">CONGRATULATIONS 🎊</h1>
                
                <div class="bg-blue-50 rounded-xl p-6 mb-8">
                    <p id="reward-desc" class="text-lg text-gray-700">
                        You've won a special prize! Check your Telegram for details.
                    </p>
                </div>
                
                <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 mb-8">
                    <p class="text-yellow-700 font-medium">
                        <i class="fas fa-info-circle mr-2"></i> DM TO @dev_offc for info
                    </p>
                </div>
                
                <button id="new-redeem-btn" class="mt-4 bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-semibold">
                    <i class="fas fa-redo mr-2"></i> Redeem Another Code
                </button>
            </div>
        </div>
    </div>
</body>
</html>
